name: Jira Ticket Check

on:
  workflow_call:

jobs:
  check-jira-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and body for Jira ticket
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          COMBINED="$PR_TITLE $PR_BODY"

          # ✏️ Replace with your actual Jira project keys
          JIRA_KEYS="TSUN|SSB|STD|FTECH|BE"
          JIRA_PATTERN="(${JIRA_KEYS})-[0-9]+"

          if echo "$COMBINED" | grep -qE "$JIRA_PATTERN"; then
            echo "✅ Jira ticket found. PR is good to go."
          else
            echo "❌ PR rejected: No Jira ticket reference found."
            echo ""
            echo "   Include at least one Jira ticket in your PR title or description."
            echo "   Valid project keys: ${JIRA_KEYS//|/, }"
            echo ""
            echo "   Examples:"
            echo "     PR title:  'TSUN-123: fix login bug'"
            echo "     PR body:   'Closes TSUN-456'"
            exit 1
          fi
