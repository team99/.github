name: Jira Ticket Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-jira-ticket:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest PR data and check for Jira ticket
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_DATA=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUM}")

          PR_TITLE=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title','') or '')")
          PR_BODY=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body','') or '')")

          echo "PR Title: ${PR_TITLE}"
          echo "PR Body: ${PR_BODY}"

          COMBINED="${PR_TITLE} ${PR_BODY}"
          JIRA_KEYS="TSUN|SSB|STD|FTECH|BE"
          JIRA_PATTERN="(${JIRA_KEYS})-[0-9]+"

          if echo "${COMBINED}" | grep -qE "${JIRA_PATTERN}"; then
            echo "✅ Jira ticket found. PR is good to go."
          else
            echo "❌ PR rejected: No Jira ticket reference found."
            echo "   Valid project keys: ${JIRA_KEYS//|/, }"
            echo "   Examples: TSUN-123 or SSB-456"
            exit 1
          fi
